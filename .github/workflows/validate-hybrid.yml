name: Validate hybrid promotions

on:
  workflow_dispatch:
    inputs:
      approve_initial_baseline:
        description: "Autorizar la primera referencia histórica"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: promotions-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        source:
          - bbva
          - buepp

    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_SECRET_KEY: validation-only

      APPROVE_INITIAL_BASELINE: ${{ inputs.approve_initial_baseline }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Validate hybrid ${{ matrix.source }}
        shell: bash
        run: |
          SOURCE="${{ matrix.source }}"
          OUTPUT="data/hybrid_current/${SOURCE}.json"

          for attempt in 1 2 3; do
            echo "Validación ${SOURCE}: intento ${attempt}/3"

            # Evitar reutilizar manifiestos de intentos anteriores
            rm -f "$OUTPUT"

            if python -m synchronization.validate_hybrid \
              --source "$SOURCE" \
              --baseline-out "$OUTPUT"; then

              echo "Validación completada correctamente"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::La validación falló después de 3 intentos"
              exit 1
            fi

            DELAY=$((attempt * 30))

            echo "Reintentando captura completa en ${DELAY} segundos..."
            sleep "$DELAY"
          done

      - name: Find previous baseline
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
        shell: bash
        run: |
          ARTIFACT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=hybrid-baseline-${SOURCE}&per_page=100" \
            --jq ".artifacts |
              map(select(
                .expired == false
                and .workflow_run.id != ${GITHUB_RUN_ID}
                and .workflow_run.head_branch == \"main\"
              )) |
              sort_by(.created_at) |
              last // empty")

          if [[ -n "$ARTIFACT" && "$ARTIFACT" != "null" ]]; then
            echo "Referencia histórica encontrada"

            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r .id <<< "$ARTIFACT")" >> "$GITHUB_OUTPUT"
            echo "run_id=$(jq -r .workflow_run.id <<< "$ARTIFACT")" >> "$GITHUB_OUTPUT"
          else
            echo "No existe una referencia histórica anterior"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download previous baseline
        if: steps.previous.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.previous.outputs.artifact_id }}
          run-id: ${{ steps.previous.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: backend/data/hybrid_previous
          merge-multiple: true

      - name: Compare historical baseline
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
        run: |
          ARGS=(
            --source "$SOURCE"
            --current "data/hybrid_current/${SOURCE}.json"
          )

          if [[ "$PREVIOUS_FOUND" == "true" ]]; then
            echo "Comparando contra referencia histórica..."

            ARGS+=(
              --previous "data/hybrid_previous/${SOURCE}.json"
            )

          elif [[ "$APPROVE_INITIAL_BASELINE" == "true" ]]; then
            echo "Creando primera referencia histórica autorizada..."

            ARGS+=(--allow-initial)
          else
            echo "::error::No existe una referencia histórica aprobada"
            exit 1
          fi

          python -m synchronization.hybrid_baseline "${ARGS[@]}"

      - name: Upload candidate for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-candidate-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/data/hybrid_current/${{ matrix.source }}.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Save approved baseline
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-baseline-${{ matrix.source }}
          path: backend/data/hybrid_current/${{ matrix.source }}.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true